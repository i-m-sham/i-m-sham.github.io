name: Update blog posts

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:         # lets you run it by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download feed
        run: curl -fsSL "https://i-m-sham.mataroa.blog/rss/" -o feed.xml

      - name: Convert feed to posts.json
        run: |
          python3 - <<'PY'
          import json, re, html
          import xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime
          from datetime import datetime

          MAX = 8
          root = ET.parse('feed.xml').getroot()

          def local(tag):
              return tag.split('}')[-1]

          def text(el, name):
              for c in el:
                  if local(c.tag) == name:
                      return (c.text or '').strip()
              return ''

          def clean(s):
              s = re.sub(r'<[^>]+>', ' ', s or '')
              s = html.unescape(s)
              return re.sub(r'\s+', ' ', s).strip()

          def fmt_date(raw):
              try:
                  d = parsedate_to_datetime(raw)
              except Exception:
                  try:
                      d = datetime.fromisoformat(raw.replace('Z', '+00:00'))
                  except Exception:
                      return raw
              return f"{d.day} {d.strftime('%b %Y')}"

          posts = []
          for el in root.iter():
              if local(el.tag) not in ('item', 'entry'):
                  continue
              url = text(el, 'link')
              if not url:
                  for c in el:
                      if local(c.tag) == 'link' and c.get('href'):
                          url = c.get('href')
                          break
              raw = text(el, 'pubDate') or text(el, 'published') or text(el, 'updated')
              body = clean(text(el, 'description') or text(el, 'summary') or text(el, 'content'))
              posts.append({
                  'title': text(el, 'title') or 'Untitled',
                  'url': url,
                  'date': fmt_date(raw),
                  'summary': body[:140] + ('…' if len(body) > 140 else '')
              })
              if len(posts) >= MAX:
                  break

          with open('posts.json', 'w', encoding='utf-8') as f:
              json.dump(posts, f, ensure_ascii=False, indent=2)
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git diff --staged --quiet || (git commit -m "Update blog posts" && git push)